alpha: 0.3
batch_size: 64
checkpoint_dir: results/checkpoints
cka_interval: 1
cka_layers:
- conv1
- conv2
- fc1
cka_max_sparsity: 0.99
cka_min_sparsity: 0.0
cka_strength: 0.5
data_check: false
data_dir: data
dataset: mnist
device: auto
dry_run: false
eval_interval: 1
experiment_config_path: configs\sparse_fedavg_mnist.yaml
global_config_path: configs\global.yaml
local_epochs: 1
log_cka: false
log_dir: results/logs
lr: 0.01
mask_update_interval: 1
method: sparse_fedavg
model: small_cnn
num_clients: 5
num_workers: 2
output_dir: results
plot_dir: results/plots
prune_fraction: 0.1
reference_size: 200
regrowth_method: gradient
rounds: 20
save_checkpoint: false
seed: 42
sparsity: 0.8
sparsity_init: random
